  name: earth-analytics-python-lj

channels:
  - conda-forge
  - nodefaults  # exclude defaults; keep compiled geospatial packages on conda-forge

dependencies:
  # rioxarray 0.24 requires Python >=3.13.
  # Allow the newest compatible Python 3.13 patch release.
  - python=3.13
  - pip

  # Core scientific Python
  - numpy
  - pandas
  - scipy
  - dask

  # Geospatial core: install through conda-forge
  - gdal  # provides: from osgeo import gdal
  - rasterio
  - pyproj>=3.0
  - geopy
  - cartopy>=0.26
  - geopandas
  - geojson
  - pyogrio

  # Raster data
  - xarray
  - h5py
  - netcdf4
  - rioxarray>=0.24
  - xarray-spatial
  - regionmask

  # Preinstall EarthPy dependencies through conda to minimize pip changes.
  # Pip may still install dependencies if its requirements are unmet.
  - scikit-image
  - requests
  - keyring
  - platformdirs

  # Interactive computing
  - ipython
  - ipykernel
  - jupyterlab
  - notebook
  - tqdm
  - jupyter-resource-usage
  - papermill
  - nb-clean  # notebook output/metadata cleaning; separate from nbclean

  # ML and modeling
  - scikit-learn
  - scikit-fuzzy

  # Data access
  - earthaccess
  - pystac-client
  - adlfs
  - dataretrieval
  - osmnx
  
  # Plotting: Matplotlib
  - matplotlib
  - nc-time-axis
  - contextily
  - seaborn

  # Plotting: HoloViz; let conda solve compatible versions together
  - holoviews>=1.20
  - hvplot
  - geoviews>=1.16
  - panel
  - bokeh
  - jupyter_bokeh

  # Browser support for Bokeh PNG export
  - selenium
  - firefox
  - geckodriver

  # Folium
  - folium

  # QA
  - flake8
  - flake8-import-order
  - black
  - autopep8
  - pydocstyle
  - nbqa

  # Install pip packages after the conda dependencies.
  - pip:
      - pygbif
      - earthpy==1.0.0

